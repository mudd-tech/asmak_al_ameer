<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06182b">
<title>أسماك الأمير | ملك الجمبري</title>
<meta name="description" content="أسماك الأمير - ملك الجمبري. المنيو، التقييم، الدفع والتواصل.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Changa:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#06182b;--card:#0c2542;--line:#1d4268;--ink:#f7f2e6;--muted:#9db4ca;--gold:#f2b632;--gold2:#ffd77a;--sea:#34b3f1;--coral:#ff6a2b;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.6}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{position:relative;max-width:480px;min-height:100vh;margin:0 auto;overflow:hidden;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.wrap::before{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;opacity:.07;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.hero{height:420px;position:relative;background:#06182b center/cover no-repeat}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,24,43,.3),rgba(6,24,43,0) 25%,rgba(6,24,43,0) 70%,var(--bg))}
.id{position:relative;z-index:1;text-align:center;margin:-34px 20px 26px}
.tag{font-family:"Aref Ruqaa",serif;font-weight:700;font-size:1.75rem;color:var(--gold2);text-shadow:0 0 18px rgba(242,182,50,.45);line-height:1.5}
.addr{color:var(--muted);font-size:.9rem}
.id::after{content:"";display:block;width:140px;height:2px;margin:14px auto 0;background:linear-gradient(90deg,transparent,var(--gold),var(--sea),transparent);box-shadow:0 0 12px rgba(242,182,50,.6)}
.list{position:relative;z-index:1;display:grid;gap:14px;padding:0 20px}
.tile{position:relative;display:flex;align-items:center;gap:14px;width:100%;color:var(--ink);text-decoration:none;font:inherit;text-align:start;cursor:pointer;border:2px solid transparent;padding:14px 18px;overflow:hidden;transition:transform .15s,filter .15s}
.tile:active{transform:scale(.985)}
.ic{flex:none;width:48px;height:48px;display:grid;place-items:center}
.ic svg{width:24px;height:24px}
.t b{display:block;font-family:Changa,"IBM Plex Sans Arabic",sans-serif;font-weight:800;font-size:1.15rem;line-height:1.3}
.t span{display:block;font-size:.82rem;color:var(--muted)}
.chev{margin-inline-start:auto;width:20px;height:20px;color:var(--muted);flex:none;transition:transform .2s}
.tile[aria-expanded="true"] .chev{transform:rotate(-90deg)}

.tile.main{padding:22px 18px;color:#06182b;border-radius:32px 8px 32px 8px;border-color:rgba(255,255,255,.35);background:linear-gradient(135deg,#ffe08f 0%,#f2b632 50%,#c48a0c 100%);box-shadow:0 0 0 1px rgba(242,182,50,.55),0 10px 32px rgba(242,182,50,.4),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -14px 24px rgba(120,70,0,.25)}
.main .ic{border-radius:50%;background:#06182b;color:var(--gold2)}
.main .t b{font-size:1.3rem}
.main .t span,.main .chev{color:rgba(6,24,43,.78)}
.main::after{content:"";position:absolute;top:-30%;bottom:-30%;left:-90px;width:50px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);pointer-events:none}

.tile.menu{border:3px double var(--gold);border-radius:14px;background:rgba(12,37,66,.85);box-shadow:0 0 22px rgba(242,182,50,.2)}
.menu .ic{border:1.5px solid var(--gold);border-radius:10px;color:var(--gold)}
.menu .t b{color:var(--gold2)}

.tile.blue{border-radius:999px;padding-inline:14px 22px;border-color:var(--sea);background:linear-gradient(180deg,#0b2d4d,#07182b);box-shadow:0 0 0 4px rgba(52,179,241,.1),0 0 26px rgba(52,179,241,.38),inset 0 0 22px rgba(52,179,241,.15)}
.blue .ic{background:linear-gradient(145deg,#a5e4ff,#2a8fd0);color:#04202f;clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%)}
.blue .t b{text-shadow:0 0 14px rgba(52,179,241,.7)}

.tile.chrome{border-radius:6px;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#fff 0%,#7d8aa0 30%,#e9eef6 55%,#566378 100%) border-box;box-shadow:0 0 24px rgba(255,255,255,.12),inset 0 0 18px rgba(255,255,255,.05);outline:1px solid rgba(255,255,255,.2);outline-offset:4px}
.chrome .ic{border-radius:10px;background:linear-gradient(145deg,#fff,#8d98ab);color:#0c2542}

.tile.wa{border-radius:8px 32px 8px 32px;border-color:rgba(255,255,255,.2);background:linear-gradient(135deg,#25b866 0%,#128c4a 55%,#0a5f33 100%);box-shadow:0 0 0 1px rgba(37,211,102,.5),0 8px 28px rgba(37,211,102,.35),inset 0 1px 0 rgba(255,255,255,.3)}
.wa .ic{border-radius:50%;background:#fff;color:#128c4a}
.wa .t span,.wa .chev{color:rgba(255,255,255,.88)}

.tile.call{border-radius:16px;border-color:var(--coral);background:#0a1f36;box-shadow:0 0 0 4px rgba(255,106,43,.1),0 0 24px rgba(255,106,43,.35),inset 0 0 20px rgba(255,106,43,.12)}
.call .ic{border-radius:50%;border:2px solid var(--coral);color:var(--coral);box-shadow:0 0 16px rgba(255,106,43,.55)}
.call .t b{text-shadow:0 0 14px rgba(255,106,43,.8)}

.tile.loc{border-radius:18px;border-color:var(--line);background:var(--card)}
.loc .ic{border-radius:50%;background:linear-gradient(145deg,var(--gold2),var(--gold));color:#06182b}

.panel{margin-top:-4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 18px}
.panel[hidden]{display:none}
.w{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.w:last-child{border-bottom:0}
.w b{display:block;font-weight:600;font-size:.92rem}
.w bdi{display:block;direction:ltr;text-align:right;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.owner{font-size:.82rem;color:var(--muted);padding:10px 0 4px}
.copy{flex:none;font:inherit;font-size:.85rem;font-weight:600;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:7px 16px;min-width:104px;text-align:center;text-decoration:none;cursor:pointer}
.copy.done{background:var(--ink);color:#06182b}

.menu-sec{position:relative;z-index:1;margin-top:40px;padding:0 20px;scroll-margin-top:16px}
.menu-sec h2{display:flex;align-items:center;gap:12px;justify-content:center;font-family:Changa,sans-serif;font-weight:800;font-size:1.7rem;color:var(--gold2)}
.menu-sec h2::before,.menu-sec h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.menu-sec h2::after{transform:scaleX(-1)}
.tabs{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;margin:0 -20px;padding:16px 20px 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font-family:Changa,sans-serif;font-weight:600;font-size:.95rem;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 16px;cursor:pointer;scroll-snap-align:center}
.tab[aria-selected="true"]{background:linear-gradient(135deg,var(--gold2),var(--gold));border-color:var(--gold);color:#06182b}
.cat{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 16px 8px}
.cat-h{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.cat-h img{width:76px;height:76px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);box-shadow:0 0 18px rgba(242,182,50,.35)}
.cat-h h3{font-family:Changa,sans-serif;font-weight:800;font-size:1.35rem;line-height:1.3}
.items{list-style:none;padding:0}
.items li{display:flex;align-items:baseline;gap:8px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.items li:last-child{border-bottom:0}
.nm{flex:0 1 auto;max-width:68%;font-weight:600}
.nm small{display:block;color:var(--muted);font-weight:400;font-size:.78rem;line-height:1.45}
.dots{flex:1;min-width:12px;border-bottom:2px dotted rgba(242,182,50,.35);transform:translateY(-5px)}
.pr{flex:none;color:var(--gold2);font-weight:700;white-space:nowrap}
.pr bdi{direction:ltr}
.pr small{font-weight:400;color:var(--muted);font-size:.75rem}
.note{color:var(--muted);font-size:.8rem;padding:4px 0 12px}

.soc{position:relative;z-index:1;display:flex;justify-content:center;gap:10px;margin-top:38px;padding:0 18px;filter:drop-shadow(0 0 7px rgba(242,182,50,.45))}
.soc a{position:relative;width:56px;height:62px;display:grid;place-items:center;color:var(--ink);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,var(--gold),var(--sea))}
.soc a::before{content:"";position:absolute;inset:2px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--bg);transition:background .2s}
.soc svg{position:relative;width:22px;height:22px}
.foot{position:relative;z-index:1;text-align:center;margin-top:32px;padding:0 20px;font-family:"Aref Ruqaa",serif;font-size:1.2rem;color:var(--gold2)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:10;background:var(--ink);color:#06182b;font-weight:700;padding:12px 24px;border-radius:999px;white-space:nowrap;box-shadow:0 8px 30px rgba(0,0,0,.55),0 0 22px rgba(242,182,50,.5);transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
a:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media(hover:hover){.tile:hover{filter:brightness(1.12)}.soc a:hover::before{background:var(--gold)}.soc a:hover{color:#06182b}}
@media(prefers-reduced-motion:no-preference){@keyframes sweep{to{left:115%}}.main::after{animation:sweep .9s 1s ease-in both}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.chev,.tile,.toast{transition:none}}
</style>
</head>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="wrap">
  <h1 class="sr" id="name"></h1>
  <div class="hero" id="hero"></div>
  <div class="id"><p class="tag" id="tag"></p><p class="addr" id="addr"></p></div>
  <div class="list" id="list"></div>
  <section class="menu-sec" id="menu" aria-label="المنيو">
    <h2>المنيو</h2>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div id="cat" role="tabpanel"></div>
  </section>
  <div class="soc" id="soc"></div>
  <p class="foot" id="foot"></p>
</div>

  instagram: `<svg ${S}><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".8" fill="currentColor"/></svg>`,
  tiktok: `<svg ${S}><path d="M14 4v10.5a3.5 3.5 0 1 1-3.5-3.5M14 4c.4 2.4 2 4 4.5 4.2"/></svg>`,
  link: `<svg ${S}><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18-3-3-3-15 0-18z"/></svg>`
};
const $ = id => document.getElementById(id);

document.title = CONFIG.name;
$("name").textContent = CONFIG.name;
$("tag").textContent = CONFIG.tagline;
$("addr").textContent = CONFIG.address;
$("foot").textContent = CONFIG.slogan;
$("hero").style.backgroundImage = "url(" + CONFIG.hero + ")";

const tile = (tag, attrs, icon, title, sub, cls) =>
  `<${tag} class="tile ${cls || ""}" ${attrs}><span class="ic">${ICON[icon]}</span><span class="t"><b>${title}</b><span>${sub}</span></span>${ICON.chev}</${tag}>`;
const exp = id => `type="button" aria-expanded="false" aria-controls="${id}"`;

let html = "";
if (CONFIG.reviewUrl) html += tile("a", `href="${CONFIG.reviewUrl}"`, "star", "قيّم تجربتك على جوجل", "رأيك بياخد دقيقة وبيفرق معانا", "main");
html += tile("a", `href="#menu"`, "book", "المنيو", "شوف الأطباق والأسعار", "menu");
if (CONFIG.instapayUrl) html += tile("a", `href="${CONFIG.instapayUrl}"`, "card", "ادفع عبر إنستاباي", "هيفتح تطبيق إنستاباي مباشرة", "blue");
if (CONFIG.wallets.length) html += tile("button", exp("wPanel"), "wallet", "المحافظ الإلكترونية", CONFIG.wallets.map(w => w.label).join("، "), "chrome") +
  `<div class="panel" id="wPanel" hidden>${CONFIG.walletOwner ? `<p class="owner">اسم الحساب: <bdi>${CONFIG.walletOwner}</bdi></p>` : ""}${
    CONFIG.wallets.map((w, i) => `<div class="w"><div><b>${w.label}</b><bdi>${w.value}</bdi></div><button type="button" class="copy" data-i="${i}" aria-label="نسخ رقم ${w.label}">نسخ</button></div>`).join("")}</div>`;
if (CONFIG.whatsapp) html += tile("a", `href="https://wa.me/${CONFIG.whatsapp}"`, "whatsapp", "تواصل معنا على واتساب", "ابعتلنا رسالة وهنرد عليك", "wa");
if (CONFIG.mapsUrl) html += tile("a", `href="${CONFIG.mapsUrl}"`, "pin", "موقعنا على الخريطة", CONFIG.address, "loc");
if (CONFIG.phones.length) html += tile("button", exp("cPanel"), "phone", "اتصل بنا", "اختار الرقم اللي يناسبك", "call") +
  `<div class="panel" id="cPanel" hidden>${CONFIG.phones.map(p => `<div class="w"><div><b>${p.label}</b><bdi>${p.show}</bdi></div><a class="copy" href="tel:${p.tel}">اتصال</a></div>`).join("")}</div>`;
$("list").innerHTML = html;

$("soc").innerHTML = CONFIG.socials.map(s => `<a href="${s.url}" aria-label="${s.label}">${ICON[s.type] || ICON.link}</a>`).join("");

document.querySelectorAll("[aria-controls]").forEach(btn => btn.onclick = () => {
  const open = btn.getAttribute("aria-expanded") === "true";
  btn.setAttribute("aria-expanded", String(!open));
  $(btn.getAttribute("aria-controls")).hidden = open;
});

/* ---- menu ---- */
function showCat(i) {
  const c = CONFIG.menu[i];
  document.querySelectorAll(".tab").forEach((t, j) => t.setAttribute("aria-selected", String(j === i)));
  $("cat").innerHTML = `<div class="cat"><div class="cat-h"><img src="${c.img}" alt=""><h3>${c.title}</h3></div>` +
    (c.note ? `<p class="note">${c.note}</p>` : "") +
    `<ul class="items">${c.items.map(it => `<li><span class="nm">${it[0]}${it[2] ? `<small>${it[2]}</small>` : ""}</span><span class="dots"></span><span class="pr">${it[1] ? `<bdi>${it[1]}</bdi> <small>جنيه</small>` : "—"}</span></li>`).join("")}</ul></div>`;
}
$("tabs").innerHTML = CONFIG.menu.map((c, i) => `<button class="tab" type="button" role="tab" data-i="${i}">${c.title}</button>`).join("");
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  showCat(+t.dataset.i);
  t.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
});
showCat(0);

/* ---- copy ---- */
function legacyCopy(text) {
  return new Promise((ok, fail) => {
    const t = document.createElement("textarea");
    t.value = text; t.setAttribute("readonly", "");
    t.style.cssText = "position:fixed;top:0;left:0;opacity:0;font-size:16px";
    document.body.appendChild(t);
    t.focus(); t.select(); t.setSelectionRange(0, text.length);
    let done = false;
    try { done = document.execCommand("copy"); } catch (e) {}
    t.remove();
    done ? ok() : fail();
  });
}
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext)
    return navigator.clipboard.writeText(text).catch(() => legacyCopy(text));
  return legacyCopy(text);
}
let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}
document.querySelectorAll("button.copy").forEach(btn => {
  btn.onclick = () => {
    const w = CONFIG.wallets[btn.dataset.i];
    copyText(w.value).then(() => {
      btn.textContent = "تم النسخ ✓"; btn.classList.add("done");
      toast("تم نسخ رقم " + w.label + " ✓");
      setTimeout(() => { btn.textContent = "نسخ"; btn.classList.remove("done"); }, 1800);
    }).catch(() => toast("اضغط مطولًا على الرقم لنسخه"));
  };
});
</script>
